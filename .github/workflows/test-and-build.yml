name: Java CI
permissions:
  contents: read
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java: ['17', '21', '25']
        os: ['ubuntu-latest', 'ubuntu-24.04-arm', 'windows-latest']
      fail-fast: false
      max-parallel: 6
    name: Java ${{ matrix.Java }} build (${{ matrix.os }})
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
        cache: 'maven'
        cache-dependency-path: 'pom.xml'
    - name: Build with Maven
      run: mvn package -P !develop
    timeout-minutes: 150
